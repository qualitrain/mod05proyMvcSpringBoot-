<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro de Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-purple: #bc13fe;
            --bg-dark: #0a0a0f;
            --panel-bg: #11131a;
        }
        
        body {
            background: 
                radial-gradient(ellipse at bottom, #1a1a2e 0%, var(--bg-dark) 100%),
                repeating-linear-gradient(0deg, rgba(0,243,255,0.03) 0px, rgba(0,243,255,0.03) 1px, transparent 1px, transparent 2px);
            font-family: 'Share Tech Mono', monospace;
            color: var(--neon-cyan);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            overflow: hidden;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(transparent 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 1;
        }
        
        .cyber-panel {
            background: var(--panel-bg);
            border: 1px solid var(--neon-cyan);
            box-shadow: 
                0 0 10px var(--neon-cyan),
                inset 0 0 20px rgba(0, 243, 255, 0.1);
            padding: 2rem;
            position: relative;
            width: 100%;
            max-width: 400px;
        }
        
        .cyber-panel::before,
        .cyber-panel::after {
            content: "";
            position: absolute;
            width: 20px; height: 20px;
            border: 2px solid var(--neon-pink);
            transition: all 0.3s ease;
        }
        .cyber-panel::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .cyber-panel::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
        
        .cyber-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            text-align: center;
            margin-bottom: 1.5rem;
            letter-spacing: 2px;
        }
        
        .form-floating {
            position: relative;
            margin-bottom: 1.2rem;
        }
        
        .form-control {
            background: rgba(17, 19, 26, 0.8);
            border: 1px solid #333;
            border-left: 3px solid var(--neon-purple);
            color: var(--neon-cyan);
            font-family: 'Share Tech Mono', monospace;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            background: rgba(0, 243, 255, 0.05);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            outline: none;
        }
        
        .form-control::placeholder { color: rgba(0, 243, 255, 0.4); }
        
        .form-floating label {
            color: rgba(0, 243, 255, 0.7);
            font-family: 'Share Tech Mono', monospace;
        }
        
        .btn-cyber {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 0.8rem;
            margin-top: 1.5rem;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .btn-cyber:hover {
            background: var(--neon-cyan);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-cyan);
        }
        
        .btn-cyber::before {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s ease;
        }
        .btn-cyber:hover::before { left: 100%; }
        
        .alert {
            background: rgba(255, 100, 100, 0.1);
            border-left: 3px solid #ff4444;
            color: #ff8888;
            font-size: 0.9rem;
        }
        .alert-success {
            border-left-color: #00ff88;
            color: #88ffcc;
            background: rgba(0, 255, 136, 0.1);
        }
        
        @keyframes glitch {
            0% { text-shadow: 0 0 0 var(--neon-cyan); }
            25% { text-shadow: 2px 0 var(--neon-pink), -2px -2px var(--neon-cyan); }
            50% { text-shadow: -2px 0 var(--neon-cyan), 2px 2px var(--neon-pink); }
            75% { text-shadow: 2px -2px var(--neon-pink), -2px 2px var(--neon-cyan); }
            100% { text-shadow: 0 0 0 var(--neon-cyan); }
        }
        
        .cyber-title:hover {
            animation: glitch 0.3s linear infinite;
        }
    </style>
</head>
<body>
    <div class="cyber-panel">
        <h3 class="cyber-title">[ REGISTRARSE ]</h3>
        
        <form th:action="@{/login}" method="post">
            <div th:if="${param.error}" class="alert" role="alert">
                ⚠️ Credenciales incorrectas
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                ✓ Sesión cerrada
            </div>
            
            <div class="form-floating">
                <input class="form-control" type="text" name="username" 
                       placeholder="Usuario" id="floatingInput" autocomplete="username"/>
                <label for="floatingInput">USUARIO</label>
            </div>
            
            <div class="form-floating">
                <input class="form-control" type="password" name="password" 
                       placeholder="Password" id="floatingPassword" autocomplete="current-password"/>
                <label for="floatingPassword">PASSWORD</label>
            </div>
            
            <button type="submit" class="btn-cyber">[ INGRESAR ]</button>
        </form>
    </div>

    <script>
        // Efecto sutil de parpadeo en inputs al cargar
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.form-control');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.style.setProperty('--glow', '1');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.style.setProperty('--glow', '0');
                });
            });
        });
    </script>
</body>
</html>
